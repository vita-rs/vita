name: Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  CC_PATTERN: '^(feat|fix|perf|refactor|test|docs|chore|ci)\((core|workspace)\)!?: [A-Z].+[^.]$'

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -qE "$CC_PATTERN"; then
            echo "::error::Non-conforming PR title: $TITLE"
            exit 1
          fi

  commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s\n' "$subject" | grep -qE "$CC_PATTERN"; then
              echo "::error::Non-conforming commit: $subject"
              failed=1
            fi
          done < <(git log --format="%s" "$BASE".."$HEAD")
          exit $failed
